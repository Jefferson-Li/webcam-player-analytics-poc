services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: webcam-player-analytics-poc:latest
    container_name: webcam-analytics
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
